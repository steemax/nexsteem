{{- $name := include "nxc.name" . -}}
{{- range $component := list "etcd" "postgres" "nexus" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    {{- include "nxc.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "nxc.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports:
  {{- if eq $component "etcd" }}
    - {name: client, port: 2379, targetPort: 2379}
    - {name: peer, port: 2380, targetPort: 2380}
  {{- else if eq $component "postgres" }}
    - {name: postgres, port: 5432, targetPort: 5432}
    - {name: patroni, port: 8008, targetPort: 8008}
  {{- else }}
    - {name: http, port: 8081, targetPort: 8081}
    - {name: replica, port: 8095, targetPort: 8095}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-postgres-rw
  labels:
    {{- include "nxc.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nxc.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
{{- if .Values.nexus.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-writer
  labels:
    {{- include "nxc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nxc.labels" . | nindent 4 }}
    app.kubernetes.io/component: nexus
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8081
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- range .Values.service.dockerPorts }}
    - name: docker-{{ .port }}
      port: {{ .port }}
      targetPort: {{ .port }}
      {{- if and (eq $.Values.service.type "NodePort") .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
    {{- end }}
{{- end }}
