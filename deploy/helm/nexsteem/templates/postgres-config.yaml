{{- $name := include "nxc.name" . -}}
{{- $domain := include "nxc.domain" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-postgres
  labels:
    {{- include "nxc.labels" . | nindent 4 }}
data:
  upgrade.py: |
    {{- .Files.Get "files/upgrade-schema.py" | nindent 4 }}
  control.sql: |
    {{- .Files.Get "files/control-bootstrap.sql" | nindent 4 }}
    {{- .Files.Get "files/storage-bootstrap.sql" | nindent 4 }}
  patroni.yaml: |
    scope: {{ $name }}
    namespace: /nexus-pg/
    restapi:
      listen: 0.0.0.0:8008
      certfile: /run/nexus-postgres/tls/tls.crt
      keyfile: /run/nexus-postgres/tls/tls.key
    etcd3:
      hosts: {{ $name }}-etcd-0-0.{{ $name }}-etcd.{{ $domain }}:2379,{{ $name }}-etcd-1-0.{{ $name }}-etcd.{{ $domain }}:2379,{{ $name }}-etcd-2-0.{{ $name }}-etcd.{{ $domain }}:2379
      protocol: https
      cacert: /run/nexus-postgres/etcd/ca.crt
      cert: /run/nexus-postgres/etcd/tls.crt
      key: /run/nexus-postgres/etcd/tls.key
    bootstrap:
      dcs:
        ttl: {{ .Values.postgres.ttl }}
        loop_wait: {{ .Values.postgres.loopWait }}
        retry_timeout: {{ .Values.postgres.retryTimeout }}
        check_timeline: true
        failsafe_mode: false
        synchronous_mode: true
        synchronous_mode_strict: {{ not .Values.postgres.allowDegradedLocalWrites }}
        synchronous_node_count: 1
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            wal_level: replica
            hot_standby: "on"
            wal_log_hints: "on"
            synchronous_commit: remote_apply
            password_encryption: scram-sha-256
            ssl: "on"
            ssl_cert_file: /run/nexus-postgres/tls/tls.crt
            ssl_key_file: /run/nexus-postgres/tls/tls.key
            ssl_ca_file: /run/nexus-postgres/tls/ca.crt
            max_connections: 150
            shared_buffers: 128MB
      initdb:
        - encoding: UTF8
        - data-checksums
        - auth-host: scram-sha-256
        - auth-local: trust
      post_init: /opt/nexus-postgres/bootstrap.py
    postgresql:
      listen: 0.0.0.0:5432
      data_dir: /var/lib/postgresql/data/pgdata
      bin_dir: /usr/lib/postgresql/17/bin
      pgpass: /tmp/pgpass
      basebackup:
        checkpoint: fast
      pg_hba:
        - local all all trust
        - hostssl replication replicator 0.0.0.0/0 scram-sha-256
        - hostssl replication replicator ::/0 scram-sha-256
        - hostssl all all 0.0.0.0/0 scram-sha-256
        - hostssl all all ::/0 scram-sha-256
    watchdog:
      mode: off
    tags:
      nofailover: false
      noloadbalance: false
      clonefrom: false
      nosync: false
