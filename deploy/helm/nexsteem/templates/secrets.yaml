{{- if not .Values.secrets.existingSecret -}}
{{- $name := include "nxc.secret" . -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nxc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $old }}
  {{- $old.data | toYaml | nindent 2 }}
  {{- else }}
  postgres-password: {{ randAlphaNum 48 | b64enc | quote }}
  replication-password: {{ randAlphaNum 48 | b64enc | quote }}
  rewind-password: {{ randAlphaNum 48 | b64enc | quote }}
  patroni-password: {{ randAlphaNum 48 | b64enc | quote }}
  nexus-password: {{ randAlphaNum 48 | b64enc | quote }}
  control-password: {{ randAlphaNum 48 | b64enc | quote }}
  etcd-root-password: {{ randAlphaNum 48 | b64enc | quote }}
  etcd-patroni-password: {{ randAlphaNum 48 | b64enc | quote }}
  etcd-proof-password: {{ randAlphaNum 48 | b64enc | quote }}
  replication.key: {{ randAlphaNum 64 | b64enc | quote }}
  tls-password: {{ randAlphaNum 48 | b64enc | quote }}
  encryption-key.json: {{ dict "active" "nexus-cluster" "keys" (list (dict "id" "nexus-cluster" "key" (randAlphaNum 64 | sha256sum))) | toJson | b64enc | quote }}
  {{- end }}
{{- end }}
