apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-docker
  namespace: nexus
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [docker.example.org]
      secretName: docker-public-tls
  rules:
    - host: docker.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-cluster-writer
                port: {number: 8090}
