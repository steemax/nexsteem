# Optional static local volumes: create the directories on durable disks first.
# Node labels nexus.cluster/slot identify the physical hosts; no data directories are shared.
# Claim names assume release nexus / namespace nexus and two Nexus replicas.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: geo-local}
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: geo-nexus-nexus-0}
spec:
  capacity: {storage: 100Gi}
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: geo-local
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: nexus
    name: data-nexus-cluster-nexus-0-0
  local: {path: /srv/nexus-volumes/nexus-0}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: nexus.cluster/slot, operator: In, values: [dc1-a]}
---
