services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    platform: linux/amd64
    command: [start-dev, --http-port=8080]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD for the local Keycloak test server}
    volumes:
      - keycloak-data:/opt/keycloak/data
volumes:
  keycloak-data:
